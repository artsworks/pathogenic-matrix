[project]
name = "pathogenic-matrix"
version = "0.1.0"
description = "Live build advisor for Pathogenic (companion app + Godot-ModLoader mod)"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["app", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A"]

[tool.mypy]
python_version = "3.10"
mypy_path = "app"
strict = true
files = ["app/matrix", "tools/pack_mod.py"]
