name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff==0.6.9 mypy==1.11.2
      - run: ruff check app tools tests
      - run: ruff format --check app tools tests
      - run: mypy
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: app
  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit==4.3.3 "setuptools<70"
      - run: gdparse mod/Artsworks-PathogenicMatrix/*.gd
      - run: gdlint mod/Artsworks-PathogenicMatrix/*.gd
      - run: gdformat --check mod/Artsworks-PathogenicMatrix/*.gd
      - run: python tools/pack_mod.py
